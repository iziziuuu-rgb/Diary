<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Diary & Finance - Mobile Optimized</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            --point-pink: #fff5f6; --point-blue: #f0f7ff; --point-blue-text: #60a5fa;
            --point-purple: #f8f7ff; --point-yellow-muted: #fefaf0; --text-main: #4b5563;
            --border-color: #eeeeee; --hover-blue: #e0f2fe; --today-bg: #e0f2fe;
        }
        body { font-family: "Pretendard Variable", sans-serif; background-color: #ffffff; color: var(--text-main); -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        section { display: none; } section.active { display: block !important; }

        /* [수정] 모바일에서 버튼이 밀리지 않도록 간격 조정 */
        .header-controls { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
        .control-btn-sm { font-size: 8px; padding: 4px 8px; border-radius: 99px; white-space: nowrap; font-weight: 800; }

        /* [수정] 하이라이트 텍스트 짤림 방지 및 모바일 대응 */
        .highlight-box { 
            background-color: var(--point-blue); border-radius: 2rem; padding: 1.5rem; 
            border: 1px solid #e0efff; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; min-height: 140px; position: relative;
        }
        #daily-highlight {
            width: 100%; background: transparent; text-align: center; border: none; outline: none;
            resize: none; font-size: 11px; line-height: 1.6; color: #64748b; height: auto; min-height: 60px;
        }

        /* 캘린더 스타일 */
        .calendar-grid { display: grid !important; grid-template-columns: repeat(7, 1fr) !important; border-top: 1.5px solid var(--border-color); border-left: 1.5px solid var(--border-color); background-color: #ffffff; position: relative; z-index: 1; }
        .calendar-cell { border-right: 1.5px solid var(--border-color); border-bottom: 1.5px solid var(--border-color); aspect-ratio: 1 / 1.3; padding: 4px; display: flex; flex-direction: column; background-color: #ffffff; position: relative; }
        .is-today { background-color: var(--today-bg) !important; }
        .cell-memo { width: 100%; flex-grow: 1; border: none; outline: none; resize: none; background: transparent; font-size: 8px; line-height: 1.2; padding: 0; margin-top: 2px; color: #111827; }

        .nav-btn { color: #9ca3af; padding-bottom: 2px; transition: all 0.2s; border-bottom: 2px solid transparent; font-size: 13px; }
        .nav-btn.active { color: #111827; font-weight: 800; border-bottom: 2px solid #111827; }
        
        .diary-box { background-color: var(--point-yellow-muted); border-radius: 2rem; padding: 1.5rem; border: 1px solid #f9f3e5; display: flex; flex-direction: column; height: 100%; }
        .diary-paper { background-color: transparent; line-height: 1.6; border: none; outline: none; resize: none; width: 100%; flex-grow: 1; color: #111827; font-size: 13px; }

        .archive-list-item { display: flex; gap: 12px; padding: 15px; border-radius: 1.5rem; background-color: #fdfdfd; border: 1px solid #f7f7f7; align-items: center; }
        .finance-item { display: flex; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid #f9fafb; font-size: 12px; }

        .photo-upload-placeholder { aspect-ratio: 1 / 1.1; background-color: #ffffff; border: 1.5px dashed #e5e7eb; border-radius: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        #sticker-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .sticker { position: absolute; pointer-events: auto; z-index: 100; }
        .sticker img { max-width: 60px; max-height: 60px; }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="max-w-xl mx-auto min-h-screen border-x border-gray-50 shadow-sm relative">

    <header class="sticky top-0 bg-white/80 backdrop-blur-md z-50 px-5 pt-10 pb-4">
        <div class="flex justify-between items-center">
            <h1 class="text-lg font-black tracking-tight text-gray-900 uppercase">Daily Diary</h1>
            <nav class="flex space-x-4">
                <button onclick="switchTab('monthly')" id="btn-monthly" class="nav-btn active">Monthly</button>
                <button onclick="switchTab('daily')" id="btn-daily" class="nav-btn">Daily</button>
                <button onclick="switchTab('records')" id="btn-records" class="nav-btn">Records</button>
                <button onclick="switchTab('finance')" id="btn-finance" class="nav-btn">Finance</button>
            </nav>
        </div>
    </header>

    <main class="p-4">
        <section id="view-monthly" class="active">
            <div class="mb-6 flex justify-between items-center px-1">
                <div class="flex items-center gap-3">
                    <button onclick="changeMonth(-1)" class="text-gray-300 text-xl font-light">&lt;</button>
                    <h2 id="calendar-title" class="text-md font-bold text-slate-800 tracking-tight"></h2>
                    <button onclick="changeMonth(1)" class="text-gray-300 text-xl font-light">&gt;</button>
                </div>
                <div class="header-controls">
                    <button onclick="exportData()" class="control-btn-sm bg-slate-50 text-slate-400 border border-slate-100">내보내기</button>
                    <button onclick="importData()" class="control-btn-sm bg-slate-50 text-slate-400 border border-slate-100">가져오기</button>
                    <button onclick="document.getElementById('sticker-upload').click()" class="control-btn-sm bg-[#f0f9ff] text-sky-200 border border-sky-50 px-5 py-2 rounded-full uppercase tracking-widest">스티커</button>
                </div>
                <input type="file" id="sticker-upload" class="hidden" accept="image/*" onchange="addSticker(event)">
                <input type="file" id="import-input" class="hidden" accept=".json" onchange="processImport(event)">
            </div>
            <div class="relative">
                <div id="calendar-container" class="calendar-grid rounded-xl overflow-hidden shadow-sm"></div>
                <div id="sticker-layer"></div>
            </div>
        </section>

        <section id="view-daily">
            <div class="flex justify-center items-center mb-8 pb-3 border-b border-gray-100">
                <h2 id="daily-date-header" class="text-[10px] font-bold tracking-widest text-gray-300 uppercase"></h2>
            </div>
            <div class="grid grid-cols-2 gap-4 items-stretch">
                <div class="flex flex-col space-y-4">
                    <div class="highlight-box">
                        <div class="w-full text-left">
                            <p class="text-[9px] font-bold uppercase text-blue-300 mb-1">Highlight</p>
                            <div style="color: var(--point-blue-text);" class="text-2xl mb-1 select-none">❝</div>
                        </div>
                        <textarea id="daily-highlight" spellcheck="false" class="w-full bg-transparent text-center text-xs font-medium outline-none h-12 resize-none" placeholder="오늘의 핵심 문장" oninput="saveDailyData()"></textarea>
                    </div>
                    <div class="diary-box flex flex-col relative">
                        <p class="text-[10px] font-bold uppercase tracking-widest mb-6" style="color: #b48a09;">Diary</p>
                        <div class="flex justify-center mb-4 relative">
                             <div id="daily-emoji" class="text-3xl h-10 w-10 flex items-center justify-center cursor-pointer" ondblclick="deleteEmoji()">🤍</div>
                             <div onclick="openEmojiPicker('daily-emoji')" class="w-6 h-6 bg-white border border-pink-100 rounded-full flex items-center justify-center text-[9px] text-pink-200 absolute -bottom-1 -right-1 cursor-pointer shadow-sm">+</div>
                        </div>
                        <textarea id="daily-content" spellcheck="false" class="diary-paper" placeholder="기록하기..." oninput="saveDailyData()"></textarea>
                    </div>
                </div>
                <div class="flex flex-col space-y-4">
                    <div class="p-4 rounded-[1.5rem] bg-[var(--point-purple)] border border-purple-100">
                        <p class="text-[9px] font-bold uppercase text-purple-500 mb-2">Music</p>
                        <input type="text" id="yt-input" oninput="updateMusicPreview(this.value); saveDailyData();" class="w-full bg-transparent border-b border-purple-100 text-[10px] italic outline-none pb-1 mb-2 text-gray-400" placeholder="URL">
                        <div id="yt-preview" class="aspect-video bg-white/50 rounded-lg flex items-center justify-center text-lg text-purple-200">🎵</div>
                    </div>
                    <div class="border border-gray-100 rounded-[1.5rem] p-4 bg-white">
                        <p class="text-[9px] font-bold uppercase text-gray-400 mb-3">To-Do</p>
                        <div id="todo-box" class="space-y-2"></div>
                        <button onclick="addNewTodo()" class="mt-3 text-[9px] font-bold text-gray-300 tracking-widest uppercase transition-colors">+ Add</button>
                    </div>
                    <div class="photo-upload-placeholder" onclick="document.getElementById('moment-upload').click()">
                        <img id="moment-preview" class="absolute inset-0 w-full h-full object-cover hidden" />
                        <div id="moment-placeholder" class="flex flex-col items-center">
                            <img src="https://img.icons8.com/material-outlined/48/cccccc/image--v1.png" class="w-7 h-7 opacity-40 mb-3" />
                            <span class="text-[8px] text-gray-300 font-bold uppercase tracking-widest">Add Photo</span>
                        </div>
                        <input type="file" id="moment-upload" class="hidden" accept="image/*" onchange="previewPhoto(event, 'moment-preview', 'moment-placeholder')">
                        <div onclick="deletePhoto(event, 'moment-preview', 'moment-placeholder', 'moment-upload')" class="btn-delete-photo">✕</div>
                    </div>
                </div>
            </div>
        </section>

        <section id="view-records">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-gray-900">Archives</h2>
                <button onclick="toggleArchiveForm()" id="btn-toggle-archive" class="w-10 h-10 bg-gray-900 text-white rounded-full text-lg shadow-xl hover:scale-110 active:scale-95">+</button>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-4 no-scrollbar" id="archive-filter-bar">
                <button class="category-chip active" onclick="filterArchives('ALL', this)">전체</button>
                <button class="category-chip" onclick="filterArchives('맛집', this)">맛집</button>
                <button class="category-chip" onclick="filterArchives('카페', this)">카페</button>
                <button class="category-chip" onclick="filterArchives('미디어', this)">미디어</button>
                <button class="category-chip" onclick="filterArchives('독서', this)">독서</button>
                <button class="category-chip" onclick="filterArchives('만화', this)">만화</button>
                <button class="category-chip" onclick="filterArchives('기타', this)">기타</button>
            </div>
            <div id="archive-form" class="hidden bg-white border border-pink-50 rounded-[2rem] p-6 mb-8 shadow-sm animate-in zoom-in-95">
                <div class="flex flex-wrap gap-2 mb-6" id="cat-selection">
                    <button class="category-chip active" onclick="selCat(this, '맛집')">맛집</button>
                    <button class="category-chip" onclick="selCat(this, '카페')">카페</button>
                    <button class="category-chip" onclick="selCat(this, '미디어')">미디어</button>
                    <button class="category-chip" onclick="selCat(this, '독서')">독서</button>
                    <button class="category-chip" onclick="selCat(this, '기타')">기타</button>
                </div>
                <div class="photo-upload-placeholder mb-6" style="aspect-ratio: 16 / 9;" onclick="document.getElementById('archive-upload').click()">
                    <img id="archive-preview" class="absolute inset-0 w-full h-full object-cover hidden" />
                    <div id="archive-placeholder" class="flex flex-col items-center">
                        <span class="text-xl mb-2">📷</span>
                        <span class="text-[10px] text-gray-300 font-bold uppercase">Tap to add photo</span>
                    </div>
                    <input type="file" id="archive-upload" class="hidden" accept="image/*" onchange="previewPhoto(event, 'archive-preview', 'archive-placeholder')">
                    <div onclick="deletePhoto(event, 'archive-preview', 'archive-placeholder', 'archive-upload')" class="btn-delete-photo">✕</div>
                </div>
                <input type="text" id="archive-title" class="w-full font-bold text-lg mb-4 outline-none border-none placeholder:text-gray-200" placeholder="제목">
                <textarea id="archive-content" spellcheck="false" class="w-full text-sm outline-none h-32 resize-none leading-relaxed placeholder:text-gray-200" placeholder="내용을 입력하세요."></textarea>
                <button onclick="saveArchive()" id="btn-archive-save" class="w-full py-4 bg-cyan-400 text-white rounded-full font-bold text-[10px] uppercase shadow-lg shadow-cyan-100">Save Record</button>
            </div>
            <div id="archive-list" class="space-y-4"></div>
        </section>

        <section id="view-finance">
            <div class="mb-8 flex justify-center items-center gap-6">
                <button onclick="changeFinanceMonth(-1)" class="text-gray-300 text-xl font-light">&lt;</button>
                <h2 id="finance-month-title" class="text-md font-bold text-slate-800 tracking-tight"></h2>
                <button onclick="changeFinanceMonth(1)" class="text-gray-300 text-xl font-light">&gt;</button>
            </div>
            
            <div class="bg-[var(--point-blue)] p-8 rounded-[2.5rem] border border-blue-50 mb-8 shadow-sm flex justify-between items-start">
                <div>
                    <p class="text-[9px] font-bold text-sky-400 uppercase mb-2">Spending</p>
                    <h3 id="total-expense" class="text-2xl font-black text-sky-600">₩ 0</h3>
                </div>
                <div class="text-right">
                    <p class="text-[9px] font-bold text-slate-400 uppercase mb-2">Profit</p>
                    <h3 id="total-profit" class="text-xl font-black text-red-400">₩ 0</h3>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-5 mb-8">
                <div class="bg-white border border-gray-100 rounded-[1.5rem] p-5 shadow-sm">
                    <h4 class="text-[10px] font-black text-sky-500 uppercase mb-4 px-1">지출 기록</h4>
                    <input type="text" id="exp-name" class="w-full text-sm font-bold border-b border-gray-50 pb-2 mb-4 outline-none" placeholder="항목">
                    <input type="number" id="exp-amount" class="w-full text-sm font-bold border-b border-gray-50 pb-2 mb-6 outline-none" placeholder="금액 (₩)">
                    <button onclick="addExpense()" class="w-full py-3 bg-sky-400 text-white rounded-full font-bold text-[9px] uppercase shadow-md shadow-sky-100">Add</button>
                </div>
                <div class="bg-white border border-gray-100 rounded-[1.5rem] p-5 shadow-sm">
                    <h4 class="text-[10px] font-black text-sky-600 uppercase mb-4 px-1">실현 손익</h4>
                    <input type="text" id="profit-name" class="w-full text-sm font-bold border-b border-gray-50 pb-2 mb-4 outline-none" placeholder="종목명">
                    <input type="number" id="profit-amount" class="w-full text-sm font-bold border-b border-gray-50 pb-2 mb-6 outline-none" placeholder="손익 (₩)">
                    <button onclick="addProfit()" class="w-full py-3 bg-sky-700 text-white rounded-full font-bold text-[9px] uppercase shadow-md shadow-sky-200">Record</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-10">
                <div id="expense-list" class="space-y-1"></div>
                <div id="profit-list" class="space-y-1"></div>
            </div>
        </section>
    </main>

    <div id="archive-detail-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-6" onclick="closeArchiveDetail()">
        <div class="bg-white rounded-[3rem] w-full max-w-sm max-h-[80vh] overflow-hidden flex flex-col shadow-2xl animate-in zoom-in-95" onclick="event.stopPropagation()">
            <div class="relative w-full bg-slate-50 flex-shrink-0">
                <img id="detail-img" src="" class="w-full max-h-60 object-cover">
                <button onclick="closeArchiveDetail()" class="absolute top-6 right-6 w-10 h-10 bg-black/20 hover:bg-black/40 backdrop-blur-md rounded-full text-white flex items-center justify-center">✕</button>
            </div>
            <div class="p-8 overflow-y-auto">
                <div class="flex justify-between items-center mb-6">
                    <span id="detail-cat" class="text-[10px] font-bold text-cyan-400 bg-cyan-50 px-3 py-1 rounded-full uppercase">CATEGORY</span>
                    <span id="detail-date" class="text-[10px] text-gray-300 font-medium">DATE</span>
                </div>
                <h2 id="detail-title" class="text-xl font-black text-gray-900 mb-6 tracking-tight">TITLE</h2>
                <p id="detail-content" class="text-xs text-gray-500 leading-relaxed whitespace-pre-wrap"></p>
                <div class="mt-8 flex gap-4 pt-6 border-t border-gray-50">
                    <button id="btn-edit-trigger" class="flex-1 py-4 bg-slate-50 text-slate-400 font-bold text-[10px] rounded-full uppercase">Edit</button>
                    <button id="btn-delete-trigger" class="flex-1 py-4 bg-red-50 text-red-300 font-bold text-[10px] rounded-full uppercase">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div id="emoji-modal" class="fixed inset-0 bg-black/5 backdrop-blur-md z-[100] hidden flex items-center justify-center">
        <div class="bg-white p-10 rounded-[3rem] max-w-sm w-full shadow-2xl">
            <div class="grid grid-cols-5 gap-6 h-80 overflow-y-auto pr-2" id="emoji-grid"></div>
            <button onclick="closeEmojiPicker()" class="w-full mt-8 py-4 bg-gray-50 text-gray-400 font-bold rounded-2xl text-[10px] uppercase">Close</button>
        </div>
    </div>

    <script>
        const now = new Date();
        const realTodayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        let currentYear = now.getFullYear(), currentMonth = now.getMonth(), financeYear = now.getFullYear(), financeMonth = now.getMonth(), selectedDate = realTodayStr;
        let curCat = '맛집', editingId = null, currentTargetId = '';
        let diaryStore = JSON.parse(localStorage.getItem('diaryStore')) || {}, archiveStore = JSON.parse(localStorage.getItem('archiveStore')) || [], financeStore = JSON.parse(localStorage.getItem('financeStore')) || {}, cellMemos = JSON.parse(localStorage.getItem('cellMemos')) || {}, stickers = JSON.parse(localStorage.getItem('stickers')) || [];

        const emojis = ['😀','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🥹','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🫠','🤐','🥴','🤢','🤮','🤧','🥱','😴','🤤','😪','😵','😵‍💫','☀️','☁️','🌥️','🌦️','🌧️','🌨️','🌩️','⛈️','🌫️','☃️','🌙','🌟','⭐','🔥','💧','🌈','🍀','🌸','🩷','🌷','🌼','🌱','🗝️','🍻','🧸','🎁','🍥','✉️','📦','🕯️','💡','💻','📱','📷','🎬','📚','🎨','🎧','🎸','🎮','🏀','⚽️','🚴','🎾','🍱','🍲','🍙','🥟','🍕','🍔','🥨','🍦','🍰','🍷','☕️','🥤','🍷','🍺','‼️','⁉️','❓','❗','⭕','❌','✅','⚠️','💤','💬','💭','🤍','🍣','✈️','🧳','🔋','🛍️','🧹'];

        window.onload = () => { updateDateHeader(); renderCalendar(); renderArchives(); renderFinance(); initEmojiPicker(); loadStickers(); switchTab('monthly'); };

        function updateDateHeader() {
            const dNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const curD = new Date(selectedDate);
            document.getElementById('daily-date-header').innerText = `${curD.getFullYear()}.${String(curD.getMonth() + 1).padStart(2, '0')}.${String(curD.getDate()).padStart(2, '0')} ${dNames[curD.getDay()]}`;
        }

        function exportData() { const blob = new Blob([JSON.stringify({ diaryStore, archiveStore, financeStore, cellMemos, stickers })], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup_${new Date().toLocaleDateString()}.json`; a.click(); }
        function importData() { document.getElementById('import-input').click(); }
        function processImport(e) { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const data = JSON.parse(ev.target.result); if (confirm("기존 기록을 지우고 복구할까요?")) { Object.entries(data).forEach(([k, v]) => localStorage.setItem(k, JSON.stringify(v))); location.reload(); } } catch (err) { alert("오류 발생"); } }; reader.readAsDataURL(file); }
        function switchTab(id) { document.querySelectorAll('section').forEach(s => s.classList.remove('active')); document.getElementById('view-' + id).classList.add('active'); document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-' + id).classList.add('active'); if(id === 'daily') loadDaily(selectedDate); window.scrollTo(0,0); }

        function renderCalendar() {
            const container = document.getElementById('calendar-container'); container.innerHTML = '';
            const labels = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
            labels.forEach(d => { const h = document.createElement('div'); h.className = "text-[7px] text-center py-2 font-bold bg-white border-r border-b"; h.style.borderColor = "var(--border-color)"; if(d==='SAT') h.classList.add('text-blue-400'); else if(d==='SUN') h.classList.add('text-red-400'); else h.classList.add('text-slate-400'); h.innerText = d; container.appendChild(h); });
            document.getElementById('calendar-title').innerText = `${currentYear}. ${String(currentMonth+1).padStart(2,'0')}`;
            const firstDay = (new Date(currentYear, currentMonth, 1).getDay() || 7) - 1;
            for(let i=0; i<firstDay; i++) { const empty = document.createElement('div'); empty.className = "border-r border-b"; empty.style.borderColor = "var(--border-color)"; container.appendChild(empty); }
            const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
            for(let i=1; i<=lastDate; i++) {
                const key = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                const cell = document.createElement('div'); cell.className = `calendar-cell cursor-pointer ${key === realTodayStr ? 'is-today' : ''}`;
                cell.innerHTML = `<span class="text-[7px] font-bold ${new Date(currentYear,currentMonth,i).getDay()===0?'text-red-300':''}">${i}</span><div class="text-center text-[10px] my-auto pointer-events-none">${diaryStore[key]?.emoji || ''}</div><textarea spellcheck="false" class="cell-memo" placeholder="메모" oninput="saveCellMemo('${key}', this.value)" onclick="event.stopPropagation()">${cellMemos[key] || ''}</textarea>`;
                cell.onclick = (e) => { if(e.target.tagName !== 'TEXTAREA') { selectedDate = key; updateDateHeader(); switchTab('daily'); renderCalendar(); } };
                container.appendChild(cell);
            }
        }
        function saveCellMemo(k, v) { cellMemos[k] = v; localStorage.setItem('cellMemos', JSON.stringify(cellMemos)); }
        function addSticker(e) { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (ev) => { const sData = { id: Date.now(), src: ev.target.result, left: 50, top: 100 }; stickers.push(sData); saveStickers(); createStickerElement(sData); }; reader.readAsDataURL(file); } }
        function createStickerElement(data) { const layer = document.getElementById('sticker-layer'); const div = document.createElement('div'); div.className = 'sticker'; div.style.left = data.left + 'px'; div.style.top = data.top + 'px'; div.innerHTML = `<img src="${data.src}">`; div.ondblclick = (e) => { e.stopPropagation(); stickers = stickers.filter(s => s.id !== data.id); saveStickers(); div.remove(); }; let isDragging = false, sX, sY; div.onmousedown = (e) => { isDragging = true; sX = e.clientX - div.offsetLeft; sY = e.clientY - div.offsetTop; div.style.zIndex = 1000; }; document.onmousemove = (e) => { if (!isDragging) return; const nL = e.clientX - sX, nT = e.clientY - sY; div.style.left = nL + 'px'; div.style.top = nT + 'px'; const s = stickers.find(item => item.id === data.id); if(s) { s.left = nL; s.top = nT; } }; document.onmouseup = () => { if(isDragging) { isDragging = false; saveStickers(); } }; layer.appendChild(div); }
        function loadStickers() { stickers.forEach(s => createStickerElement(s)); }
        function saveStickers() { localStorage.setItem('stickers', JSON.stringify(stickers)); }
        function saveArchive() { const t = document.getElementById('archive-title').value, c = document.getElementById('archive-content').value, img = document.getElementById('archive-preview'); if(!t) return; const entry = { id: editingId || Date.now(), title: t, content: c, cat: curCat, photo: img.classList.contains('hidden') ? '' : img.src, date: new Date().toLocaleDateString() }; if(editingId) { const idx = archiveStore.findIndex(a => a.id === editingId); archiveStore[idx] = entry; editingId = null; } else { archiveStore.push(entry); } localStorage.setItem('archiveStore', JSON.stringify(archiveStore)); clearArchiveForm(); toggleArchiveForm(); renderArchives(); }
        function renderArchives(filter = 'ALL') { const b = document.getElementById('archive-list'); b.innerHTML = ''; const list = filter === 'ALL' ? archiveStore : archiveStore.filter(a => a.cat === filter); list.forEach(a => { const d = document.createElement('div'); d.className = "archive-list-item"; d.onclick = () => showArchiveDetail(a); d.innerHTML = `<div class="w-12 h-12 rounded-xl bg-gray-50 flex-shrink-0 overflow-hidden">${a.photo ? `<img src="${a.photo}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-gray-200 text-[8px]">Pic</div>`}</div><div class="flex-grow"><div class="flex justify-between items-start mb-1"><span class="text-[8px] font-bold text-cyan-400 bg-cyan-50 px-2 py-0.5 rounded-full uppercase">${a.cat}</span><span class="text-[8px] text-gray-300 font-medium">${a.date}</span></div><h3 class="font-bold text-xs text-gray-800">${a.title}</h3><p class="text-[10px] text-gray-400 mt-1 line-clamp-1">${a.content}</p></div>`; b.prepend(d); }); }
        function showArchiveDetail(a) { document.getElementById('detail-cat').innerText = a.cat; document.getElementById('detail-date').innerText = a.date; document.getElementById('detail-title').innerText = a.title; document.getElementById('detail-content').innerText = a.content; const img = document.getElementById('detail-img'); if(a.photo) { img.src = a.photo; img.classList.remove('hidden'); } else { img.classList.add('hidden'); } document.getElementById('btn-edit-trigger').onclick = () => editArchive(a); document.getElementById('btn-delete-trigger').onclick = () => deleteArchive(a.id); document.getElementById('archive-detail-modal').classList.remove('hidden'); }
        function closeArchiveDetail() { document.getElementById('archive-detail-modal').classList.add('hidden'); }
        function editArchive(a) { closeArchiveDetail(); if(document.getElementById('archive-form').classList.contains('hidden')) toggleArchiveForm(); editingId = a.id; document.getElementById('archive-title').value = a.title; document.getElementById('archive-content').value = a.content; const img = document.getElementById('archive-preview'), place = document.getElementById('archive-placeholder'); if(a.photo) { img.src = a.photo; img.classList.remove('hidden'); place.classList.add('hidden'); } window.scrollTo(0,0); }
        function deleteArchive(id) { if(confirm('삭제?')) { archiveStore = archiveStore.filter(a => a.id !== id); localStorage.setItem('archiveStore', JSON.stringify(archiveStore)); closeArchiveDetail(); renderArchives(); } }
        function filterArchives(cat, btn) { document.querySelectorAll('#archive-filter-bar .category-chip').forEach(c => c.classList.remove('active')); btn.classList.add('active'); renderArchives(cat); }
        function clearArchiveForm() { document.getElementById('archive-title').value = ''; document.getElementById('archive-content').value = ''; document.getElementById('archive-preview').classList.add('hidden'); document.getElementById('archive-placeholder').classList.remove('hidden'); editingId = null; }
        function changeFinanceMonth(s) { financeMonth += s; if(financeMonth>11){financeMonth=0;financeYear++}else if(financeMonth<0){financeMonth=11;financeYear--} renderFinance(); }
        function addExpense() { const n = document.getElementById('exp-name').value, a = document.getElementById('exp-amount').value; if(!n || !a) return; const key = `${financeYear}-${financeMonth}`; if(!financeStore[key]) financeStore[key] = { expenses: [], profits: [] }; financeStore[key].expenses.push({ id: Date.now(), name: n, amount: Number(a) }); localStorage.setItem('financeStore', JSON.stringify(financeStore)); document.getElementById('exp-name').value = ''; document.getElementById('exp-amount').value = ''; renderFinance(); }
        function addProfit() { const n = document.getElementById('profit-name').value, a = document.getElementById('profit-amount').value; if(!n || !a) return; const key = `${financeYear}-${financeMonth}`; if(!financeStore[key]) financeStore[key] = { expenses: [], profits: [] }; financeStore[key].profits.push({ id: Date.now(), name: n, amount: Number(a) }); localStorage.setItem('financeStore', JSON.stringify(financeStore)); document.getElementById('profit-name').value = ''; document.getElementById('profit-amount').value = ''; renderFinance(); }
        function deleteFinanceItem(type, id) { const key = `${financeYear}-${financeMonth}`; financeStore[key][type] = financeStore[key][type].filter(i => i.id !== id); localStorage.setItem('financeStore', JSON.stringify(financeStore)); renderFinance(); }
        function renderFinance() { document.getElementById('finance-month-title').innerText = `${financeYear}. ${String(financeMonth+1).padStart(2,'0')}`; const key = `${financeYear}-${financeMonth}`; const data = financeStore[key] || { expenses: [], profits: [] }; const exList = document.getElementById('expense-list'); exList.innerHTML = ''; let totalEx = 0; data.expenses.forEach(e => { totalEx += e.amount; const d = document.createElement('div'); d.className = "finance-item"; d.innerHTML = `<span>${e.name}</span><span class="text-sky-600 font-bold">₩ ${e.amount.toLocaleString()}<i onclick="deleteFinanceItem('expenses', ${e.id})" class="btn-del-mini">✕</i></span>`; exList.prepend(d); }); document.getElementById('total-expense').innerText = `₩ ${totalEx.toLocaleString()}`; const prList = document.getElementById('profit-list'); prList.innerHTML = ''; let totalPr = 0; data.profits.forEach(p => { totalPr += p.amount; const d = document.createElement('div'); d.className = "finance-item"; d.innerHTML = `<span>${p.name}</span><span class="${p.amount >= 0 ? 'text-red-500' : 'text-blue-500'} font-bold">${p.amount >= 0 ? '+' : ''}${p.amount.toLocaleString()}원<i onclick="deleteFinanceItem('profits', ${p.id})" class="btn-del-mini">✕</i></span>`; prList.prepend(d); }); const prEl = document.getElementById('total-profit'); prEl.innerText = `₩ ${totalPr.toLocaleString()}`; prEl.className = totalPr >= 0 ? "text-xl font-black text-red-400" : "text-xl font-black text-blue-400"; }

        function loadDaily(key) { const d = diaryStore[key] || { highlight:'', content:'', emoji:'🤍', youtube:'', todos:[], moment:'' }; document.getElementById('daily-highlight').value = d.highlight; document.getElementById('daily-content').value = d.content; document.getElementById('daily-emoji').innerText = d.emoji || '🤍'; document.getElementById('yt-input').value = d.youtube; updateMusicPreview(d.youtube); const box = document.getElementById('todo-box'); box.innerHTML = ''; (d.todos || []).forEach(t => addTodoRow(t.text, t.done)); if(!d.todos?.length) addNewTodo(); const img = document.getElementById('moment-preview'), place = document.getElementById('moment-placeholder'); if(d.moment) { img.src = d.moment; img.classList.remove('hidden'); place.classList.add('hidden'); } else { img.classList.add('hidden'); place.classList.remove('hidden'); } }
        function saveDailyData() { const todos = []; document.querySelectorAll('.todo-item').forEach(r => { const txt = r.querySelector('input[type="text"]').value, chk = r.querySelector('input[type="checkbox"]').checked; if(txt) todos.push({ text: txt, done: chk }); }); diaryStore[selectedDate] = { highlight: document.getElementById('daily-highlight').value, content: document.getElementById('daily-content').value, emoji: document.getElementById('daily-emoji').innerText, youtube: document.getElementById('yt-input').value, todos: todos, moment: document.getElementById('moment-preview').src.startsWith('data') ? document.getElementById('moment-preview').src : (diaryStore[selectedDate]?.moment || '') }; localStorage.setItem('diaryStore', JSON.stringify(diaryStore)); renderCalendar(); }
        function deletePhoto(ev, pId, hId, iId) { ev.stopPropagation(); const i = document.getElementById(pId), h = document.getElementById(hId); i.src = ''; i.classList.add('hidden'); h.classList.remove('hidden'); document.getElementById(iId).value=''; if(pId==='moment-preview') saveDailyData(); }
        function previewPhoto(ev, pId, hId) { const f = ev.target.files[0]; if(f) { const r = new FileReader(); r.onload = (e) => { const i = document.getElementById(pId), h = document.getElementById(hId); i.src = e.target.result; i.classList.remove('hidden'); h.classList.add('hidden'); if(pId==='moment-preview') saveDailyData(); }; r.readAsDataURL(f); } }
        function updateMusicPreview(u) { const id = (u.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/)?.[2] || null); document.getElementById('yt-preview').innerHTML = id ? `<iframe class="w-full h-full rounded-lg" src="https://www.youtube.com/embed/${id}"></iframe>` : '🎵'; }
        function initEmojiPicker() { const g = document.getElementById('emoji-grid'); emojis.forEach(e => { const d = document.createElement('div'); d.className = "text-xl cursor-pointer text-center p-2 hover:bg-gray-50 rounded-xl"; d.innerText = e; d.onclick = () => { if(currentTargetId) { document.getElementById(currentTargetId).innerText = e; saveDailyData(); } closeEmojiPicker(); }; g.appendChild(d); }); }
        function openEmojiPicker(id) { currentTargetId = id; document.getElementById('emoji-modal').classList.remove('hidden'); }
        function closeEmojiPicker() { document.getElementById('emoji-modal').classList.add('hidden'); }
        function deleteEmoji() { document.getElementById('daily-emoji').innerText = ''; saveDailyData(); }
        function addNewTodo() { addTodoRow('', false); }
        function addTodoRow(t, d) { const div = document.createElement('div'); div.className = "todo-item flex items-center space-x-2"; div.innerHTML = `<input type="checkbox" ${d?'checked':''} onchange="saveDailyData()" class="w-3 h-3 rounded-full border-gray-100 accent-gray-900"><input type="text" class="w-full bg-transparent text-[10px] outline-none text-gray-400" value="${t}" placeholder="할 일..." oninput="saveDailyData()">`; document.getElementById('todo-box').appendChild(div); }
        function selCat(btn, c) { document.querySelectorAll('#cat-selection .category-chip').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); curCat = c; }
        function toggleArchiveForm() { document.getElementById('archive-form').classList.toggle('hidden'); editingId = null; }
        function changeMonth(s) { currentMonth += s; if(currentMonth>11){currentMonth=0;currentYear++}else if(currentMonth<0){currentMonth=11;currentYear--} renderCalendar(); }
    </script>
</body>
</html>
